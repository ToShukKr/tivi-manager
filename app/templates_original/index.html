<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiVi DB Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .container {
            width: 80%;
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .poster {
            width: 100px;
            height: auto;
        }
        .pagination {
            margin-top: 20px;
            text-align: center;
        }
        .pagination button {
            margin: 0 5px;
            padding: 5px 10px;
        }
        .search-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .search-bar input {
            flex: 1;
            padding: 10px;
            margin-right: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .search-bar button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .search-bar button:hover {
            background-color: #0056b3;
        }
        .action-button {
            padding: 5px 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            height: 37px;
        }
        .action-button:hover {
            background-color: #218838;
        }
        .active {
            font-weight: bold;
            text-decoration: underline;
        }
        .kp-input {
            margin-top: 10px;
            display: flex;
            align-items: center;
        }
        .kp-input input {
            flex: 1;
            padding: 10px;
            margin-right: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        hr {
            border: none;
            height: 1px;
            background-color: #b5b3b33d;
            margin: 20px 0;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            position: relative;
            width: 400px;
            display: flex;
            flex-direction: column;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }
        .modal h2 {
            margin-top: 0;
        }
        .modal select {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .modal button {
            margin-top: auto;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Movie List</h1>
    <div class="search-bar">
        <input type="text" v-model="searchQuery" placeholder="Enter movie title...">
        <button @click="search">Search</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>Poster</th>
                <th>Information</th>
            </tr>
        </thead>
        <tbody>
            <tr v-for="movie in content" :key="movie.link">
                <td>
                    <img :src="movie.poster" alt="Poster" class="poster">
                </td>
                <td>
                    <h2>
                        <a :href="movie.link" target="_blank" v-html="movie.name"></a>
                    </h2>
                    <p>Year: <span v-html="movie.year"></span></p>
                    <p>Translation: <span v-html="movie.translation"></span></p>
                    <hr></hr>
                    <div class="kp-input">
                        <button class="action-button" @click="openModal(movie.name, movie.link)">Add to TiVi DB</button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="pagination">
        <button @click="changePage(1)" :disabled="current_page <= 1">First</button>
        <button @click="changePage(current_page - 1)" :disabled="current_page <= 1">Back</button>
        <span v-if="current_page > 2">...</span>
        <span v-for="page in pagesArray" :key="page">
            <button @click="changePage(page)" :class="{ 'active': page === current_page }">
                <span v-html="page"></span>
            </button>
        </span>
        <span v-if="current_page < pages - 1">...</span>
        <button @click="changePage(current_page + 1)" :disabled="current_page >= pages">Next</button>
        <button @click="changePage(pages)" :disabled="current_page >= pages">Last</button>
    </div>

    <div v-if="showModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" @click="closeModal">&times;</button>
            <h2><a :href="modalLink" target="_blank"><span v-html="modalName"></span></a></h2>
            <p>ID: <span v-html="selected_filmix_id"></span></p>
            <select v-model="selectedTranslation">
                <option value="" disabled>Select Translation</option>
                <template v-for="translation in translations" :key="translation.id">
                    <option :value="translation" v-html="translation.name"></option>
                </template>
            </select>
            <button @click="addToDb">Add to DB</button>
        </div>
    </div>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            currentURL: `${window.location.protocol}//${window.location.hostname}:${window.location.port}`,
            searchQuery: "",
            current_page: 1,
            pages: 1,
            content: [],
            selected_filmix_id: "",
            showModal: false,
            modalName: "",
            modalLink: "",
            selectedTranslation: "",
            translations: []
        },
        computed: {
            pagesArray() {
                const pagesArray = [];
                const startPage = Math.max(1, this.current_page - 1);
                const endPage = Math.min(this.pages, this.current_page + 1);

                for (let i = startPage; i <= endPage; i++) {
                    pagesArray.push(i);
                }

                return pagesArray;
            }
        },
        mounted() {
            if (this.searchQuery.length > 0) {
                this.fetchData();
            }
        },
        methods: {
            async fetchData() {
                axios.post(`${this.currentURL}/api/v1/search`, { name: this.searchQuery, page: this.current_page })
                const response = await axios.post(`${this.currentURL}/api/v1/search`, { name: this.searchQuery, page: this.current_page }, { headers: { "Content-Type": "application/json" } });
                const data = response.data;
                this.current_page = parseInt(data.current_page);
                this.pages = parseInt(data.pages);
                this.content = data.content;
            },
            async fetchTranslations(url) {
              const response = await axios.post(`${this.currentURL}/api/v1/get-translate`, { "url": url }, { headers: { "Content-Type": "application/json" } });
              this.translations = response.data
            },
            search() {
                this.current_page = 1;
                this.fetchData();
            },
            changePage(page) {
                if (page >= 1 && page <= this.pages) {
                    this.current_page = page;
                    this.fetchData();
                }
            },
            openModal(name, url) {
                this.fetchTranslations(url);
                const regex = /\/([^/]+?)-/;
                const match = url.match(regex);

                if (match && match[1]) {
                    this.selected_filmix_id = match[1].split('-')[0];
                } else {
                    console.log('ID not found in the URL.');
                    this.selected_filmix_id = false;
                }

                this.modalName = name;
                this.modalLink = url;
                this.showModal = true;
                console.log(name)
                console.log(url)
                console.log(this.selected_filmix_id)
            },
            closeModal() {
                this.showModal = false;
            },
            addToDb() {
                console.log('Adding to DB:', {
                    name: this.modalName,
                    id: this.selected_filmix_id,
                    translation: this.selectedTranslation
                });
                this.closeModal();
            }
        }
    });
</script>

</body>
</html>
